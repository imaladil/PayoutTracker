name: Build APK

# - every push to main builds the APK and keeps it as a downloadable build artifact
# - pushing a tag like v1.2 (release.sh does this) also publishes a GitHub Release with the APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7

      - name: Check google-services.json
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json restored from the GOOGLE_SERVICES_BASE64 secret."
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing. Google login would not work in this build."
            exit 1
          fi

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "Signing key restored."
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing. The APK will be signed with a temporary debug key and cannot update an app installed from an earlier build. Run setup.sh to add the secrets."
          fi

      - name: Print signing fingerprints
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -f app/release.jks ]; then
            keytool -list -v -keystore app/release.jks -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" -alias "${KEY_ALIAS:-payout}" | grep -E "SHA1|SHA256" || true
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify the release APK is signed and intact
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          unzip -tq "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verifies|Verified using|SHA-256 digest" 
          "$BT/aapt2" dump badging "$APK" | head -3

      - name: Build plain debug APK (for comparison)
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: PayoutTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "PayoutTracker-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: PayoutTracker-apk
          path: PayoutTracker-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "PayoutTracker-${GITHUB_REF_NAME}.apk" \
            --title "Payout Tracker ${GITHUB_REF_NAME}" \
            --generate-notes
